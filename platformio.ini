; MiniKB — clavier de macros BLE (ESP32-C3 SuperMini, portable ESP32-S3)
[platformio]
default_envs = esp32c3

[esp32_common]
platform = espressif32@6.13.0
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    esp32async/ESPAsyncWebServer@^3.7.0
    esp32async/AsyncTCP@^3.4.0
    bblanchon/ArduinoJson@^7.4.0
build_flags = -Wall -Wextra

; La SuperMini n'a pas de définition dédiée : la devkitm-1 a le même C3 4 Mo.
[env:esp32c3]
extends = esp32_common
board = esp32-c3-devkitm-1
build_flags = ${esp32_common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; S3 : BLE + USB HID natif (TinyUSB). Retire -DMINIKB_USB_HID pour du BLE seul.
[env:esp32s3]
extends = esp32_common
board = esp32-s3-devkitc-1
build_unflags = -DARDUINO_USB_MODE=1
build_flags = ${esp32_common.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMINIKB_USB_HID

; Tests unitaires de la table de conversion, sur le PC (nécessite gcc).
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<keymap_fr_us.cpp>
build_flags = -std=c++17 -Wall -Wextra
